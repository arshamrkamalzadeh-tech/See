<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مخزن آب کمال زاده</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800;900&display=swap">
<style>
:root{--sky:#18B4F4;--sky-d:#0B86C4;--sky-l:#E6F6FE;--ink:#1F2D3A;--mut:#6B7B8A;--bg:#F5F9FC;--card:#fff;--line:#E3EDF4;--navy:#0B2236;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E8F2F8;--mut:#9DB2C2;--bg:#08141D;--card:#0F2433;--line:#1B3447;--sky-l:#12354A;--sky-d:#4FC8FA}}
:root[data-theme="dark"]{--ink:#E8F2F8;--mut:#9DB2C2;--bg:#08141D;--card:#0F2433;--line:#1B3447;--sky-l:#12354A;--sky-d:#4FC8FA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8}
.w{max-width:1000px;margin:0 auto;padding:0 16px}
.top{background:var(--card);box-shadow:0 8px 26px rgba(11,34,54,.10);border-radius:0 0 26px 26px;padding:12px 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-weight:900;font-size:16px;white-space:nowrap}
.lg{background:#000;object-fit:contain;display:block}
.brand .lg{width:56px;height:50px;border-radius:14px}
.st{background:var(--sky-l);color:var(--ink);border-radius:999px;padding:3px 12px;font-weight:900;font-size:13px;white-space:nowrap}
.menu{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding:2px 2px 6px}
.pill{color:var(--ink);text-decoration:none;font-weight:800;font-size:14px;white-space:nowrap;padding:5px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.pill:hover,.pill:focus-visible{background:var(--sky);color:#04283D;outline:none}
.banner{margin:18px auto 0;max-width:968px;min-height:198px;border-radius:26px;background:url("https://cdn.imgurl.ir/uploads/o160382_IMG_20261006_153647.jpg") center/cover no-repeat,linear-gradient(135deg,#0B2236,#0E4A6E 55%,#18B4F4);padding:24px 20px;display:flex;align-items:center;justify-content:flex-end}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.banner h1{margin:0 0 6px;font-size:clamp(24px,6vw,42px);font-weight:900;line-height:1.35}
.banner p{margin:0;font-weight:800;font-size:15px;opacity:.95}
.banner .lg{width:120px;height:104px;border-radius:22px;border:2px solid rgba(255,255,255,.35);flex:none}
.feat{display:grid;grid-template-columns:repeat(4,1fr);margin:26px auto 0;max-width:968px}
.f{text-align:center;padding:6px 3px;border-inline-start:1px solid var(--line);font-weight:800;font-size:12.5px;line-height:1.7;color:var(--sky-d)}
.f:first-child{border:0}
.f img{height:42px;width:auto;max-width:100%;object-fit:contain;display:block;margin:0 auto 4px}
.f svg{width:40px;height:40px;stroke:var(--sky);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 4px}
.sh{text-align:center;margin:34px 0 16px}
.sh i{display:block;width:34px;height:22px;margin:0 auto 6px;border-radius:6px;background:linear-gradient(var(--sky) 0 8px,transparent 8px 14px,var(--sky) 14px 22px)}
.sh small{display:block;color:var(--mut);font-weight:800;font-size:13px}
.sh h2{margin:0;font-size:clamp(22px,5vw,30px);font-weight:900;color:var(--sky-d)}
.card{background:var(--card);border-radius:24px;box-shadow:0 10px 30px rgba(11,34,54,.10);padding:22px 18px;max-width:968px;margin:26px auto 0;text-align:center}
.card h3{margin:0 0 4px;font-size:clamp(20px,5vw,28px);font-weight:900}
.card p{margin:0 0 14px;color:var(--mut);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:968px;margin:0 auto}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.cat{all:unset;cursor:pointer;display:block;border-radius:20px;overflow:hidden;background:var(--navy);box-shadow:0 10px 24px rgba(11,34,54,.18)}
.cat img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:radial-gradient(circle at 50% 40%,#16496b,#0B2236)}
.cat span{display:block;color:#fff;font-weight:900;font-size:17px;text-align:center;padding:9px 6px;background:var(--navy)}
.cat:hover span,.cat:focus-visible span{background:var(--sky);color:#04283D}
.cat:focus-visible,.vol:focus-visible,.back:focus-visible,.go:focus-visible,.btns a:focus-visible{outline:4px solid var(--sky-d);outline-offset:3px}
.back,.go,.vol,.btns a{font-weight:900;border:3px solid #04283D;background-color:var(--sky);color:#04283D;background-image:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%);box-shadow:0 6px 0 rgba(4,40,61,.65),0 10px 14px rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
.back,.go{all:unset;cursor:pointer;display:inline-block;border-radius:999px;font-weight:900;border:3px solid #04283D;background-color:var(--sky);color:#04283D;background-image:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%);box-shadow:0 6px 0 rgba(4,40,61,.65),0 10px 14px rgba(0,0,0,.2)}
.back{display:block;width:fit-content;font-size:17px;padding:7px 22px;margin:18px auto 0 0}
.go{font-size:21px;padding:12px 36px}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;margin:6px 0 14px}
.btns a{display:inline-block;text-decoration:none;font-size:19px;padding:11px 28px;border-radius:999px}
.btns a.alt{background-color:var(--card);color:var(--ink);border-color:var(--ink)}
.back:active,.go:active,.btns a:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(4,40,61,.65)}
.tel{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 14px;font-weight:900;line-height:1.5}
.tel .nm{font-size:clamp(20px,5vw,26px);color:var(--ink)}
.tel .nu{font-size:clamp(28px,8vw,44px);color:var(--sky-d);direction:ltr}
.info{margin:2px 0 0!important;color:var(--ink)!important}
.pic{width:100%;max-height:340px;object-fit:contain;background:radial-gradient(circle at 50% 40%,#16496b,#0B2236);border-radius:22px;display:block;box-shadow:0 10px 24px rgba(11,34,54,.18)}
.sub{font-weight:900;margin:22px 0 10px;font-size:18px}
.vols{display:flex;flex-wrap:wrap;gap:12px 8px}
.vol{all:unset;cursor:pointer;border-radius:12px;padding:5px 16px;font-size:17px;font-weight:900;border:3px solid #04283D;background-color:var(--sky-l);color:var(--ink);box-shadow:0 5px 0 rgba(4,40,61,.65)}
.vol[aria-pressed="true"]{background-color:var(--sky);color:#04283D;transform:translateY(4px);box-shadow:0 1px 0 rgba(4,40,61,.65)}
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.spec div{background:var(--navy);color:#fff;border-radius:18px;padding:14px 10px;text-align:center}
.spec small{display:block;font-size:14px;opacity:.85}
.spec b{font-size:34px;font-weight:900;color:var(--sky);line-height:1.3}
.spec em{font-style:normal;font-size:14px}
.note{color:var(--mut);font-weight:800}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:8px 0 18px;text-align:right}
.fields label{font-weight:800;display:block}
.fields input{width:100%;margin-top:4px;font:inherit;font-weight:900;font-size:20px;text-align:center;padding:10px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.fields input:focus-visible{outline:3px solid var(--sky);border-color:var(--sky)}
.best{background:linear-gradient(135deg,#0B2236,#0E4A6E);color:#fff;border-radius:20px;padding:18px;margin-top:20px}
.best h3{margin:0;font-size:20px}
.best .big{font-size:42px;font-weight:900;color:var(--sky);line-height:1.3}
.alt2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin-top:10px;font-weight:800;text-align:right}
.why{position:relative;max-width:968px;margin:34px auto 0;border-radius:26px;background:linear-gradient(160deg,#0B2236,#0E4A6E);color:#fff;height:70px;text-align:center}
.why .lg{width:92px;height:80px;border-radius:18px;margin:0 auto 10px;border:2px solid rgba(255,255,255,.3)}
.why p{margin:0 auto;max-width:620px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:900px;margin:-46px auto 0;position:relative;padding:0 14px}
.stat{background:var(--card);border-radius:16px;box-shadow:0 8px 22px rgba(11,34,54,.14);padding:10px 3px;text-align:center;min-height:86px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.stat img{height:36px;width:auto;max-width:100%;object-fit:contain;display:block;margin-bottom:2px}
.stat b{display:block;color:var(--sky-d);font-size:15px;font-weight:900;line-height:1.5}
.stat span{font-size:11.5px;font-weight:800;color:var(--mut)}
.accs{display:grid;grid-template-columns:1fr;gap:14px;max-width:968px;margin:0 auto}
@media(min-width:700px){.accs{grid-template-columns:1fr 1fr}}
.acc{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 10px 24px rgba(11,34,54,.14)}
.acc img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;background:radial-gradient(circle at 50% 40%,#16496b,#0B2236)}
.acc h3{margin:0;padding:12px 14px 4px;font-size:20px;font-weight:900;color:var(--sky-d)}
.acc p{margin:0;padding:0 14px;color:var(--mut);font-weight:800;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 16px}
.chips b{background:var(--sky-l);color:var(--ink);border:2px solid var(--sky);border-radius:10px;padding:1px 14px;font-size:17px;font-weight:900}
.buy{background:var(--card);border-radius:22px;box-shadow:0 10px 24px rgba(11,34,54,.14);padding:20px 16px;text-align:center}
.buy h3{margin:0 0 4px;font-size:21px;font-weight:900;color:var(--sky-d)}
.buy p{margin:0 0 14px;font-weight:800;color:var(--ink)}
.buy .btns{margin:4px 0 6px}
footer{margin-top:44px;background:var(--navy);color:#fff;text-align:center;padding:28px 16px;border-radius:26px 26px 0 0}
footer .lg{width:72px;height:64px;border-radius:16px;margin:0 auto 8px;border:2px solid rgba(255,255,255,.3)}
footer p{margin:2px 0;font-weight:800}
footer small{opacity:.75}
.ab{max-width:968px;margin:0 auto}
.abc{background:var(--card);border-radius:24px;box-shadow:0 10px 30px rgba(11,34,54,.10);padding:18px 18px 14px}
.abt{position:relative;overflow:hidden;max-height:9.6em;transition:max-height .35s ease}
.abt p{margin:0 0 12px;font-size:15px;font-weight:800;line-height:2;color:var(--ink);text-align:justify}
.abt p.end{color:var(--sky-d);font-weight:900}
.abt:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3.8em;background:linear-gradient(to bottom,transparent,var(--card));pointer-events:none}
.abb{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--mut);font-weight:900;font-size:15px;-webkit-tap-highlight-color:transparent}
.abb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.abb[aria-expanded="true"] svg{transform:rotate(180deg)}
.abb:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.back,.go,.btns a,.abt,.abb svg{transition:none}}
</style>
</head>

'<p>فروشگاه مخزن آب کمال زاده با ارائه انواع مخازن پلی اتیلن، آماده تأمین نیاز مشتریان در زمینه ذخیره و نگهداری آب و انواع مایعات است. این فروشگاه با چندین سال تجربه در شهر کرج در زمینه عرضه مخازن پلی اتیلن، خدمات و محصولات مطمئنی به مشتریان ارائه می‌دهد.</p>'+
'<p>ما انواع مخازن پلی اتیلن باکیفیت، سه‌لایه و تک لایه را در ظرفیت‌ها و مدل‌های مختلف عرضه می‌کنیم تا بتوانید متناسب با فضای موردنظر و میزان مصرف، گزینه مناسب خود را انتخاب کنید.</p>'+
'<p>این مخازن برای مصارف خانگی، کشاورزی، صنعتی، باغداری، دامداری، کارگاهی و نگهداری مایعات مناسب هستند و می‌توان از آن‌ها برای ذخیره آب شرب، آب آبیاری، کود و سموم کشاورزی، مواد اولیه و برخی مایعات مورد استفاده در صنایع بهره برد. انتخاب مخزن مناسب باید بر اساس نوع مایع، ظرفیت موردنیاز، شرایط محیطی و نحوه استفاده انجام شود.</p>'+
'<p>در فروشگاه مخزن آب کمال زاده تلاش می‌کنیم محصولات باکیفیت را با قیمت مناسب، مشاوره قبل از خرید و خدمات مطمئن در اختیار مشتریان قرار دهیم.</p>'+
'<p>اگر برای منزل، ساختمان، باغ، زمین کشاورزی، دامداری، کارگاه یا واحدهای صنعتی به مخزن آب و نگهداری مایعات نیاز دارید، می‌توانید برای انتخاب ظرفیت و مدل مناسب با ما تماس بگیرید.</p>'+
'<p class="end">مخزن آب کمال زاده؛ کیفیت، تنوع و قیمت مناسب در کنار مشاوره تخصصی.</p>'+
'</div><button class="abb" id="abb" aria-expanded="false" aria-controls="abt"><span id="abl">نمایش متن</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div></div>'}
function bindAbout(){var t=gi("abt"),b=gi("abb");if(!t||!b)return;
b.onclick=function(){var o=t.classList.toggle("open");b.setAttribute("aria-expanded",o?"true":"false");gi("abl").textContent=o?"بستن متن":"نمایش متن";t.style.maxHeight=o?t.scrollHeight+"px":""}}
function home(){
app.innerHTML='<h1 class="sr">مخزن آب کمال زاده</h1><div class="banner"></div>'+
'<div class="feat">'+f("a","۱۲ سال گارانتی تعویض")+f("b","سه لایه و ضد جلبک")+'<div class="f">'+pic(IMG_STD,"استاندارد")+'استاندارد</div><div class="f">'+pic(IMG_APL,"سیب سلامت")+'سیب سلامت</div>'+'</div>'+about()+
'<div class="card"><h3>مخزن مناسب مکان شما کدام است؟</h3><p>لطفاً طول، عرض و ارتفاع مکان نصب را وارد نمایید تا مناسب‌ترین مخزن را به شما پیشنهاد دهیم.</p><button class="go" id="gc">ماشین‌حساب انتخاب مخزن</button></div>'+
'<div id="cats">'+sh("Water Tank Categories","انواع مخازن")+'</div>'+catGrid()+acc()+buy()+
cta()+
'<div class="why"></div>'+
'<div class="stats"><div class="stat"><b dir="ltr">12 years</b><span dir="ltr">guarantee</span></div><div class="stat"><b dir="ltr">3 layers</b><span>ضد جلبک</span></div><div class="stat">'+pic(IMG_STD,"استاندارد")+'<b>استاندارد</b></div><div class="stat">'+pic(IMG_APL,"سیب سلامت")+'<b>سیب سلامت</b></div></div>';
app.querySelectorAll(".cat").forEach(function(b){b.onclick=function(){location.hash="#/"+b.dataset.id}});
gi("gc").onclick=function(){location.hash="#/calc"};
bindAbout();
}
function num(v){return parseFloat(String(v).replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d)}).replace("٫","."))}
function dim(s,r){return (s.d?'قطر '+fa(r[1]):'طول '+fa(r[1])+' × عرض '+fa(r[2]))+' × ارتفاع '+fa(r[3])+' سانتی‌متر'}
function find(L,W,H){var res=[];
D.forEach(function(s){var best=null;
s.v.forEach(function(r){if(r.length<2)return;
var l=r[1],w=s.d?r[1]:r[2],ok=r[3]<=H&&((l<=L&&w<=W)||(l<=W&&w<=L));
if(ok&&(!best||r[0]>best[0]))best=r});
if(best)res.push({s:s,r:best})});
return res.sort(function(a,b){return b.r[0]-a.r[0]})}
function calc(){
app.innerHTML='<button class="back" id="bk">بازگشت</button>'+sh("Tank Selector","انتخاب مناسب‌ترین مخزن")+
'<div class="card" style="margin-top:0"><p>لطفاً ابعاد مکانی را که قصد نصب مخزن در آن دارید، به سانتی‌متر وارد نمایید.</p>'+
'<div class="fields"><label>طول مکان<input id="cl" inputmode="numeric" placeholder="برای نمونه: ۲۰۰"></label><label>عرض مکان<input id="cw" inputmode="numeric" placeholder="برای نمونه: ۱۵۰"></label><label>ارتفاع مکان<input id="ch" inputmode="numeric" placeholder="برای نمونه: ۱۸۰"></label></div>'+
'<button class="go" id="go">دریافت پیشنهاد</button><div id="out" aria-live="polite"></div></div>'+cta();
gi("bk").onclick=function(){location.hash="#/"};
gi("go").onclick=function(){
var L=num(gi("cl").value),W=num(gi("cw").value),H=num(gi("ch").value),o=gi("out");
if(!(L>0&&W>0&&H>0)){o.innerHTML='<p class="note" style="margin-top:14px">لطفاً هر سه مقدار طول، عرض و ارتفاع را وارد نمایید.</p>';return}
var r=find(L,W,H);
if(!r.length){o.innerHTML='<p class="note" style="margin-top:14px">متأسفانه در این ابعاد مخزنی قابل نصب نیست. برای دریافت راهنمایی با ما تماس بگیرید.</p>';return}
var b=r[0];
o.innerHTML='<div class="best"><h3>پیشنهاد ما: مخزن '+b.s.t+'</h3><div class="big">'+fa(b.r[0])+' لیتر</div><div>'+dim(b.s,b.r)+'</div></div>'+
(r.length>1?'<p class="sub">سایر گزینه‌ها</p>'+r.slice(1).map(function(x){return '<div class="alt2"><span>'+x.s.t+' — '+fa(x.r[0])+' لیتر</span><span>'+dim(x.s,x.r)+'</span></div>'}).join(""):"")+
'<p class="note" style="margin-top:12px">لطفاً فضای لازم برای نصب و تردد را نیز در نظر بگیرید.</p>'}}
function spec(s){
var r=s.v[sel],o="";
if(r.length<2)return '<p class="note">ابعاد این مدل به‌زودی اضافه می‌شود.</p>';
var b=function(l,x){return '<div><small>'+l+'</small><b>'+fa(x)+'</b> <em>سانتی‌متر</em></div>'};
o+=b(s.d?"قطر":"طول",r[1]);
if(!s.d)o+=b("عرض",r[2]);
o+=b("ارتفاع با درب",r[3]);
return '<div class="spec">'+o+'</div>';
}
function detail(s){
var r=s.v[sel];
app.innerHTML='<button class="back" id="bk">بازگشت</button>'+sh("Water Tank",s.t)+img(s,"pic")+
'<p class="sub">لطفاً حجم مخزن را انتخاب فرمایید</p><div class="vols">'+
s.v.map(function(x,i){return '<button class="vol" aria-pressed="'+(i===sel)+'" data-i="'+i+'">'+fa(x[0])+' لیتر'+(x[4]?' ('+x[4]+')':'')+'</button>'}).join("")+
'</div><p class="sub">ابعاد مخزن '+fa(r[0])+' لیتری'+(r[4]?' ('+r[4]+')':'')+'</p>'+spec(s)+cta();
gi("bk").onclick=function(){location.hash="#/"};
app.querySelectorAll(".vol").forEach(function(b){b.onclick=function(){sel=+b.dataset.i;detail(s)}});
}
function accPage(){
app.innerHTML='<button class="back" id="bk">بازگشت</button>'+acc()+cta();
gi("bk").onclick=function(){location.hash="#/"};
}
function route(){
var id=location.hash.replace("#/",""),s=D.filter(function(x){return x.id===id})[0];
sel=0;window.scrollTo(0,0);
if(id==="calc"){calc();return}
if(id==="acc"){accPage();return}
if(id==="tanks"){tanksPage();return}
if(s){detail(s);return}
home();
if(id==="cats")gi(id).scrollIntoView();
}
function stat(){
var el=gi("st");
try{var p=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tehran",hour:"numeric",minute:"numeric",hourCycle:"h23"}).formatToParts(new Date()),h=0,m=0;
p.forEach(function(x){if(x.type==="hour")h=+x.value;if(x.type==="minute")m=+x.value});
var t=h*60+m,o=t>=540&&t<1080;
el.textContent=o?"🟢 فروشگاه باز است":"🔴 فروشگاه بسته است";el.hidden=false}catch(e){el.hidden=true}}
stat();setInterval(stat,30000);
window.onhashchange=route;route();
</script>
</body>
</html>
